# NextCRM for Coolify (and other platforms that inject env vars).
#
# Same stack as docker-compose.yml, but every deployment-specific value is
# a ${VAR}, so one instance = this file + env vars set in the platform UI.
#
# Coolify: build pack "Docker Compose", compose location
# /docker-compose-coolify.yml. Assign your domain to the `app` service
# (port 3000) and, if browsers should reach uploaded files, a second domain
# to the `minio` service (port 9000) and set MINIO_PUBLIC_URL to it.
#
# Required (deploy fails without them): POSTGRES_PASSWORD,
# MINIO_ROOT_PASSWORD, BETTER_AUTH_SECRET, EMAIL_ENCRYPTION_KEY.
# NEXTCRM_VERSION is optional: the release tag to run (default latest).
# INNGEST_SIGNING_KEY / INNGEST_EVENT_KEY are optional: when unset, the app
# generates them on first start and keeps them in the app_data volume.
# Set the secrets once and never change them: a new BETTER_AUTH_SECRET logs
# everyone out, a new EMAIL_ENCRYPTION_KEY makes stored mailbox passwords
# unreadable.
#   BETTER_AUTH_SECRET:   openssl rand -base64 32
#   EMAIL_ENCRYPTION_KEY: openssl rand -hex 32
#
# No host ports are published; the platform's proxy routes to the
# containers on the internal network.

services:
  # --- PostgreSQL Database (with pgvector extension for embeddings) ---
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nextcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nextcrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nextcrm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextcrm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MinIO Object Storage ---
  minio:
    # MinIO stopped publishing images (minio/minio is gone); pgsty/minio is a
    # community rebuild with the same entrypoint, command and curl.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    expose:
      - "9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nextcrm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - nextcrm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Inngest server (background jobs) ---
  # Self-hosted Inngest in production mode: every call to /api/inngest must be
  # signed with INNGEST_SIGNING_KEY. Keys come from the platform env or, when
  # unset, from the files the app generates (app_data volume, read-only).
  # Runs, schedules and sleeps persist in inngest_data.
  inngest:
    image: inngest/inngest:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Non-hex values (e.g. the old default "local") are ignored, like the app does.
        printf '%s' "$${INNGEST_SIGNING_KEY}" | grep -Eq '^([0-9a-fA-F]{2})+$$' || INNGEST_SIGNING_KEY=
        printf '%s' "$${INNGEST_EVENT_KEY}" | grep -Eq '^([0-9a-fA-F]{2})+$$' || INNGEST_EVENT_KEY=
        until [ -n "$${INNGEST_SIGNING_KEY}" ] || [ -s /app-data/secrets/INNGEST_SIGNING_KEY ]; do sleep 1; done
        until [ -n "$${INNGEST_EVENT_KEY}" ] || [ -s /app-data/secrets/INNGEST_EVENT_KEY ]; do sleep 1; done
        export INNGEST_SIGNING_KEY="$${INNGEST_SIGNING_KEY:-$$(cat /app-data/secrets/INNGEST_SIGNING_KEY)}"
        export INNGEST_EVENT_KEY="$${INNGEST_EVENT_KEY:-$$(cat /app-data/secrets/INNGEST_EVENT_KEY)}"
        exec inngest start --sdk-url http://app:3000/api/inngest --poll-interval 60 --sqlite-dir /var/lib/inngest
    environment:
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
    volumes:
      - app_data:/app-data:ro
      - inngest_data:/var/lib/inngest
    networks:
      - nextcrm
    # No healthcheck: the image ships no HTTP client (see docker-compose.yml).

  # --- NextCRM Application ---
  app:
    # The release image, built once per release by GitHub Actions. Pin a
    # version with NEXTCRM_VERSION=v0.26.0; "always" makes a redeploy fetch
    # the image currently tagged, so latest really is the latest release.
    image: ghcr.io/pdovhomilja/nextcrm-app:${NEXTCRM_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-nextcrm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nextcrm}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-nextcrm}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-nextcrm}

      # App + auth (public URL of this instance, e.g. https://crm.example.com)
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NextCRM}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?set EMAIL_ENCRYPTION_KEY}

      # MinIO (MINIO_PUBLIC_URL = the URL browsers use to upload and fetch
      # files; presigned upload URLs are signed for it)
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-nextcrm}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-nextcrm}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      # Inngest — production mode against the bundled server. Empty keys are
      # generated on first start and shared with it (see the inngest service).
      INNGEST_DEV: "0"
      INNGEST_ID: ${INNGEST_ID:-nextcrm}
      INNGEST_APP_NAME: ${INNGEST_APP_NAME:-NextCRM}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
      INNGEST_BASE_URL: ${INNGEST_BASE_URL:-http://inngest:8288}

      # Email. Login is passwordless email OTP sent through Resend, so
      # RESEND_API_KEY and EMAIL_FROM (a verified Resend sender) are needed
      # before anyone can sign in. RESEND_FROM_EMAIL is the campaign sender.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      # SMTP (port 465, TLS) for the mails sent via lib/sendmail.ts
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}

      # Initial admin account, created by the seed on first start.
      # Must be a real inbox: login codes are sent there.
      TEST_USER_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-}

      # Optional services. Leave empty to use keys saved in the admin panel
      # (an env value always wins over the admin panel).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_ID: ${GOOGLE_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
      # Token for the public lead/contact intake endpoints
      NEXTCRM_TOKEN: ${NEXTCRM_TOKEN:-}
      # Allow mail servers / plugin HTTP calls to private IPs ("true")
      MAIL_ALLOW_PRIVATE_HOSTS: ${MAIL_ALLOW_PRIVATE_HOSTS:-}
      PLUGIN_HTTP_ALLOW_PRIVATE_HOSTS: ${PLUGIN_HTTP_ALLOW_PRIVATE_HOSTS:-}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      inngest:
        condition: service_started
    networks:
      - nextcrm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  minio_data:
  app_data:
  inngest_data:

networks:
  nextcrm:
    driver: bridge
