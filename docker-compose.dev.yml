# Local development support services for nextcrm-dev.
#
# This is NOT the full containerized stack — that lives in docker-compose.yml
# and runs the app in Docker too. This file supports the workflow where you
# run `pnpm dev` on the host and only the supporting services are containerized.
#
#   pnpm db:up          # start Postgres (localhost:5433)
#   pnpm inngest:up     # start everything in this file (Inngest + Postgres)
#   pnpm dev            # then run the app on the host
#
# Inngest dashboard: http://localhost:8288
# Postgres:          postgresql://nextcrm:nextcrm@localhost:5433/nextcrm

name: nextcrm-dev

services:
  # --- Inngest Dev Server ---
  inngest:
    image: inngest/inngest:latest
    container_name: nextcrm-dev-inngest
    restart: unless-stopped
    command:
      - inngest
      - dev
      # Persist run/event history across restarts (writes to /.inngest/main.db).
      - --persist
      # Auto-discovery scans common ports (3000-3010, 8000, 8080, 5173, ...)
      # and would register OTHER local projects' Inngest apps, then execute
      # their functions from this server. Keep it off and sync only nextcrm.
      - --no-discovery
      - -u
      - http://host.docker.internal:3000/api/inngest
    ports:
      # Dashboard + event API. The connect gateway (8289) is deliberately not
      # published: the app uses HTTP serve (app/api/inngest/route.ts), not
      # connect mode, and 8289 is already taken by another local project.
      - "8288:8288"
    volumes:
      - inngest_data:/.inngest
    extra_hosts:
      # Redundant on Docker Desktop, required on Linux. Keeps the file portable.
      - "host.docker.internal:host-gateway"
    # No healthcheck: the image ships no HTTP client (no curl/wget/nc), and
    # nothing depends on this service being ready.

  # --- PostgreSQL (pgvector) for local host-dev ---
  # Separate from docker-compose.yml's postgres: that one belongs to the full
  # containerised stack and deliberately does not publish a host port. This one
  # is published so `pnpm dev` on the host can reach it, and uses its own volume
  # so the two workflows never share state.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nextcrm-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextcrm
      POSTGRES_PASSWORD: nextcrm
      POSTGRES_DB: nextcrm
    ports:
      # 5433 on the host: 5432 is left free for any system Postgres.
      # Bound to loopback only (not 0.0.0.0): credentials are the throwaway
      # nextcrm/nextcrm pair above, so this must not be reachable from the
      # LAN/VPN/any other network interface — only from this machine.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcrm -d nextcrm"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- SeaweedFS: S3-compatible local object storage ---
  # MinIO's public Docker images were gated by MinIO in 2025 (minio/minio and
  # minio/mc no longer pull anonymously), so local dev uses SeaweedFS's S3
  # gateway instead. NextCRM's S3 client (lib/minio.ts) is generic path-style,
  # so it treats this exactly like MinIO. R2 is still used on QA/prod.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: nextcrm-dev-s3
    restart: unless-stopped
    # S3 API on :9000 (matches MINIO_ENDPOINT in .env); creds from the config.
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports:
      # Loopback only — the throwaway nextcrm/changeme creds must not be
      # reachable off this machine.
      - "127.0.0.1:9000:9000"
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs-s3-config.json:/etc/seaweedfs/s3.json:ro

  # One-shot: wait for the S3 API, create the `nextcrm` bucket (matches
  # MINIO_BUCKET in .env), and set a permissive CORS rule so the browser's
  # presigned PUT uploads from localhost:3000 succeed. Uses the public AWS CLI
  # image against the SeaweedFS endpoint.
  createbucket:
    image: amazon/aws-cli:latest
    container_name: nextcrm-dev-createbucket
    depends_on:
      - seaweedfs
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: nextcrm
      AWS_SECRET_ACCESS_KEY: changeme
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - >
        for i in $$(seq 1 30); do
          aws --endpoint-url http://seaweedfs:9000 s3api create-bucket --bucket nextcrm >/dev/null 2>&1 && break;
          echo 'waiting for seaweedfs s3...'; sleep 2;
        done;
        aws --endpoint-url http://seaweedfs:9000 s3api put-bucket-cors --bucket nextcrm --cors-configuration
        '{"CORSRules":[{"AllowedOrigins":["http://localhost:3000"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"]}]}' || true;
        aws --endpoint-url http://seaweedfs:9000 s3 ls;
        echo 'bucket ready'

volumes:
  inngest_data:
  postgres_dev_data:
  seaweedfs_data:
